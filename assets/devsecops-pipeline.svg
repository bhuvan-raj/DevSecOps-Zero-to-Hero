<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="DevSecOps pipeline: Code, Build, Test, Deploy, Monitor with security tools" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14304d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Security at every stage of the pipeline</text>
  <text x="600" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9fb3c8">Shift left. Automate. Enforce. Monitor.</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- stage boxes -->
    <g>
      <rect x="40"  y="110" width="200" height="110" rx="14" fill="#0f2238" stroke="url(#accent)" stroke-width="2"/>
      <text x="140" y="140" font-size="18" font-weight="700" fill="#22d3ee">CODE</text>
      <text x="140" y="166" font-size="13" fill="#e2e8f0">Gitleaks</text>
      <text x="140" y="186" font-size="13" fill="#e2e8f0">SonarQube (SAST)</text>
      <text x="140" y="206" font-size="13" fill="#e2e8f0">Dependency-Check</text>
    </g>
    <g>
      <rect x="260" y="110" width="200" height="110" rx="14" fill="#0f2238" stroke="url(#accent)" stroke-width="2"/>
      <text x="360" y="140" font-size="18" font-weight="700" fill="#22d3ee">BUILD</text>
      <text x="360" y="166" font-size="13" fill="#e2e8f0">Trivy</text>
      <text x="360" y="186" font-size="13" fill="#e2e8f0">Syft (SBOM)</text>
      <text x="360" y="206" font-size="13" fill="#e2e8f0">Cosign (signing)</text>
    </g>
    <g>
      <rect x="480" y="110" width="200" height="110" rx="14" fill="#0f2238" stroke="url(#accent)" stroke-width="2"/>
      <text x="580" y="140" font-size="18" font-weight="700" fill="#22d3ee">TEST</text>
      <text x="580" y="166" font-size="13" fill="#e2e8f0">OWASP ZAP (DAST)</text>
      <text x="580" y="186" font-size="13" fill="#e2e8f0">Checkov (IaC)</text>
      <text x="580" y="206" font-size="13" fill="#e2e8f0">Security gates</text>
    </g>
    <g>
      <rect x="700" y="110" width="200" height="110" rx="14" fill="#0f2238" stroke="url(#accent)" stroke-width="2"/>
      <text x="800" y="140" font-size="18" font-weight="700" fill="#22d3ee">DEPLOY</text>
      <text x="800" y="166" font-size="13" fill="#e2e8f0">Kyverno policies</text>
      <text x="800" y="186" font-size="13" fill="#e2e8f0">Vault (secrets)</text>
      <text x="800" y="206" font-size="13" fill="#e2e8f0">OIDC and RBAC</text>
    </g>
    <g>
      <rect x="920" y="110" width="240" height="110" rx="14" fill="#0f2238" stroke="url(#accent)" stroke-width="2"/>
      <text x="1040" y="140" font-size="18" font-weight="700" fill="#22d3ee">MONITOR</text>
      <text x="1040" y="166" font-size="13" fill="#e2e8f0">Falco (runtime)</text>
      <text x="1040" y="186" font-size="13" fill="#e2e8f0">Prometheus + Grafana</text>
      <text x="1040" y="206" font-size="13" fill="#e2e8f0">Loki (logs)</text>
    </g>
  </g>

  <!-- arrows -->
  <g fill="#34d399">
    <polygon points="242,165 258,165 250,157"/>
    <polygon points="462,165 478,165 470,157"/>
    <polygon points="682,165 698,165 690,157"/>
    <polygon points="902,165 918,165 910,157"/>
  </g>
  <g stroke="#34d399" stroke-width="3" stroke-linecap="round">
    <line x1="241" y1="165" x2="259" y2="165"/>
    <line x1="461" y1="165" x2="479" y2="165"/>
    <line x1="681" y1="165" x2="699" y2="165"/>
    <line x1="901" y1="165" x2="919" y2="165"/>
  </g>
</svg>
